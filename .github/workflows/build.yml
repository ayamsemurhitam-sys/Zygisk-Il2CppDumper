name: Build
on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "Package name of the game:"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    # PERBAIKAN: Diperbarui dari v3 ke v4
    - uses: actions/checkout@v4

    # PERBAIKAN: Diperbarui dari v3 ke v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'
        cache: 'gradle'

    - name: Prepare and Build Module
      run: |
        chmod +x ./gradlew
        # Menggunakan sintaks inputs modern yang lebih aman
        sed -i 's/moduleDescription = "/moduleDescription = "(${{ inputs.package_name }}) /g' module.gradle
        sed -i "s/com.game.packagename/${{ inputs.package_name }}/g" module/src/main/cpp/game.h
        ./gradlew :module:assembleRelease

    # PERBAIKAN: Diperbarui dari v3 ke v4
    - uses: actions/upload-artifact@v4
      with:
        name: zygisk-il2cppdumper
        path: out/magisk_module_release/
